name: Preview thumbnails (temporary)

on:
  push:
    branches: [claude/reels-longform-benchmarking-tool-d4t4bj]
    paths: [.github/workflows/thumbs-preview.yml]

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download thumbnails
        run: |
          python3 - <<'EOF'
          import json, pathlib, urllib.request, concurrent.futures as cf
          out = pathlib.Path(".preview-thumbs"); out.mkdir()
          r = json.load(open("trends/data/refs.json"))
          kr_new = {"UCIG4gr_wIy5CIlcFciUbIQw", "UCwx6n_4OcLgzAGdty0RWCoA", "UCGX5sP4ehBkihHwt5bs5wvg", "UCUyfkq9e9ZfPzxOW5WQ9rzQ", "UCNhofiqfw5nl-NeDJkXtPvw"}
          r["channels"] = [c for c in r["channels"] if c["id"] in kr_new]
          jobs = {}
          for c in r["channels"]:
              th = c.get("thumb") or ""
              jobs[f"{c['id']}.jpg"] = th if th.startswith("http") else f"https://yt3.ggpht.com/{th}=s88-c-k-c0x00ffffff-no-rj"
              for v in c.get("recent", []):
                  jobs[f"{v['id']}.jpg"] = f"https://i.ytimg.com/vi/{v['id']}/mqdefault.jpg"
          def get(kv):
              name, url = kv
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  (out / name).write_bytes(urllib.request.urlopen(req, timeout=20).read())
              except Exception as e:
                  return f"{name} {e}"
          errs = [e for e in cf.ThreadPoolExecutor(16).map(get, jobs.items()) if e]
          print(len(jobs) - len(errs), "ok", len(errs), "failed", errs[:5])
          EOF
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .preview-thumbs
          git commit -qm "tmp: preview thumbnails"
          git push origin "HEAD:${GITHUB_REF_NAME}"
