name: Preview fetch (temporary)

on:
  push:
    branches: [claude/reels-longform-benchmarking-tool-d4t4bj]
    paths: [.tmp-fetch/input.json]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search channels, download thumbnails
        run: python3 .tmp-fetch/fetch.py
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .preview-thumbs
          git commit -qm "tmp: preview fetch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
