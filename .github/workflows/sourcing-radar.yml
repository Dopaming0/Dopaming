name: 소싱 레이더 주간 스캔

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sourcing-radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 지난 결과 복원
        uses: actions/cache@v4
        with:
          path: sourcing-radar/out
          key: radar-out-${{ github.run_id }}
          restore-keys: radar-out-

      - name: 스캔
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: python -m radar.cli scan --keywords keywords.csv --out out

      - name: 변화 감지
        id: diff
        run: |
          python -m radar.cli diff --out out | tee diff.txt
          {
            echo 'changes<<EOF'
            cat diff.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: 리포트 보관
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_number }}
          path: sourcing-radar/out/

      - name: 진입 창이 열리면 이슈 생성
        if: contains(steps.diff.outputs.changes, '진입 창 열림')
        uses: actions/github-script@v7
        with:
          script: |
            const body = `주간 소싱 스캔에서 진입 창이 감지됐습니다.\n\n\`\`\`\n${{ toJSON(steps.diff.outputs.changes) }}\n\`\`\`\n\n리포트는 이 실행의 Artifacts에서 \`radar.html\`을 받으세요.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `소싱 진입 창 감지 — ${new Date().toISOString().slice(0,10)}`,
              body,
            });
