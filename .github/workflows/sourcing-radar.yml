name: 소싱 레이더 주간 스캔

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write           # 진입 창 감지 시 이슈를 연다

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sourcing-radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 지난 결과 복원
        uses: actions/cache@v4
        with:
          path: sourcing-radar/out
          key: radar-out-${{ github.run_id }}
          restore-keys: radar-out-

      - name: 스캔
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: python -m radar.cli scan --keywords keywords.csv --out out

      - name: 변화 감지
        id: diff
        run: |
          python -m radar.cli diff --out out | tee diff.txt
          # 구분자를 매번 새로 뽑는다. 출력에 'EOF' 줄이 있어도 깨지지 않는다.
          delim="diff-$(openssl rand -hex 12)"
          {
            echo "changes<<${delim}"
            cat diff.txt
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: 리포트 보관
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_number }}
          path: sourcing-radar/out/

      - name: 진입 창이 열리면 이슈 생성
        if: contains(steps.diff.outputs.changes, '진입 창 열림')
        uses: actions/github-script@v7
        env:
          # 스크립트 본문에 보간하지 않는다. 아이템명에 백틱이나 ${ 가 들어와도
          # 템플릿 리터럴이 깨지지 않도록 환경변수로 넘긴다.
          CHANGES: ${{ steps.diff.outputs.changes }}
        with:
          script: |
            const changes = process.env.CHANGES || '';
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              '주간 소싱 스캔에서 진입 창이 감지됐습니다.',
              '',
              '```text',
              changes,
              '```',
              '',
              '리포트는 이 실행의 Artifacts에서 `radar.html`을 받으세요.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `소싱 진입 창 감지 — ${today}`,
              body,
            });
